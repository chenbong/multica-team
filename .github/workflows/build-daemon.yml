name: Build daemon

# Builds the Multica CLI + daemon from this repository's overlay for every
# platform the upstream release covers (see multica/.goreleaser.yml), so the
# macOS host that runs the agent runtimes and the Linux host that runs the API
# can both use the same patched binary instead of the plain upstream release.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-daemon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-overlay:
    name: verify overlay against the pinned upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: multica/server/go.mod
          cache-dependency-path: multica/server/go.sum

      - name: Prepare the Go overlay manifest
        run: |
          python3 overlays/prepare.py
          python3 overlays/prepare.py --check

      - name: Compile-check the overlaid packages
        working-directory: multica/server
        env:
          DATABASE_URL: postgres://overlay:overlay@127.0.0.1:1/overlay?sslmode=disable&connect_timeout=1
          MULTICA_RUN_REAL_AGENT_SMOKE: "0"
        run: |
          set -euo pipefail
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          cd "$workspace/multica/server"
          export GOFLAGS="-overlay=$workspace/overlays/go-overlay.json -mod=readonly"
          go test -run '^$' \
            ./cmd/server ./cmd/multica ./internal/cli ./internal/daemon/... ./internal/handler \
            ./internal/service ./pkg/agent ./pkg/db/generated

      - name: Test ducc and ducx preparation with fixture CLIs
        working-directory: multica/server
        env:
          MULTICA_RUN_REAL_AGENT_SMOKE: "0"
        run: |
          set -euo pipefail
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          export GOFLAGS="-overlay=$workspace/overlays/go-overlay.json -mod=readonly"
          go test ./internal/daemon -run 'Test(Ducc|Ducx|RunDucxSetupCommand|PrepareDucxRuntimeWithoutShellReload)' -count=1

      - name: Test OneAPI catalog with isolated HTTP and credential fixtures
        working-directory: multica/server
        run: |
          set -euo pipefail
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          go test -overlay="$workspace/overlays/go-overlay.json" ./pkg/agent -run '^TestOneAPI' -count=1

      - name: Fail if the build touched the upstream checkout
        run: |
          set -euo pipefail
          if [ -n "$(git -C multica status --porcelain)" ]; then
            echo "the multica submodule is no longer clean:" >&2
            git -C multica status --short >&2
            exit 1
          fi

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Same target set as multica/.goreleaser.yml.
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: multica/server/go.mod
          cache-dependency-path: multica/server/go.sum

      - name: Prepare the Go overlay manifest
        run: |
          python3 overlays/prepare.py
          python3 overlays/prepare.py --check

      - name: Build the CLI and daemon
        id: build
        working-directory: multica/server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          cd "$workspace/multica/server"
          export GOFLAGS="-overlay=$workspace/overlays/go-overlay.json -mod=readonly"
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          # Branch builds follow the pinned upstream release, never an older
          # overlay tag from the parent repository. A tagless checkout uses its SHA.
          parent_rev="$(git -C ../.. rev-parse --short HEAD)"
          upstream_commit="$(git -C .. rev-parse --short HEAD)"
          upstream_tag="$(git -C .. describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"
          base_version="${upstream_tag#v}"
          if [ -z "$base_version" ]; then
            base_version="$upstream_commit"
          fi
          # Preserve the fork's release naming and reject a plain upstream tag.
          # Upstream auto-update treats x.y.z as eligible for replacement;
          # overlay suffixes keep that automatic path disabled.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-overlay\.[0-9]+$ ]]; then
              echo "daemon release tags must use v<upstream-version>-overlay.<number>" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            if [ "${version%-overlay.*}" != "$base_version" ]; then
              echo "release tag $GITHUB_REF_NAME does not match pinned upstream $upstream_tag" >&2
              exit 1
            fi
          else
            version="${base_version}-overlay.${parent_rev}"
          fi
          out="$workspace/dist/multica-$GOOS-$GOARCH$suffix"
          mkdir -p "$workspace/dist"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${upstream_commit}-overlay.${parent_rev} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$out" ./cmd/multica
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "built $out as ${version}"
          ls -l "$out"

      - name: Smoke-test the native binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          ./dist/multica-linux-amd64 version

      - name: Package the binary
        shell: bash
        env:
          GOOS_TARGET: ${{ matrix.goos }}
          GOARCH_TARGET: ${{ matrix.goarch }}
          BUILD_VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          # Keep local macOS packaging identical to the Linux release runner.
          export COPYFILE_DISABLE=1
          suffix=""
          mkdir -p pkg
          cp ../multica/LICENSE ../multica/NOTICE pkg/
          if [ "$GOOS_TARGET" = "windows" ]; then
            suffix=".exe"
            cp "multica-${GOOS_TARGET}-${GOARCH_TARGET}${suffix}" "pkg/multica${suffix}"
            zip -q -j "multica_${GOOS_TARGET}_${GOARCH_TARGET}.zip" "pkg/multica${suffix}" pkg/LICENSE pkg/NOTICE
            cp "multica_${GOOS_TARGET}_${GOARCH_TARGET}.zip" "multica-cli-${BUILD_VERSION}-${GOOS_TARGET}-${GOARCH_TARGET}.zip"
            rm -rf pkg
          else
            cp "multica-${GOOS_TARGET}-${GOARCH_TARGET}${suffix}" "pkg/multica${suffix}"
            tar -czf "multica_${GOOS_TARGET}_${GOARCH_TARGET}.tar.gz" -C pkg "multica${suffix}" LICENSE NOTICE
            cp "multica_${GOOS_TARGET}_${GOARCH_TARGET}.tar.gz" "multica-cli-${BUILD_VERSION}-${GOOS_TARGET}-${GOARCH_TARGET}.tar.gz"
            rm -rf pkg
          fi
          ls -l

      - name: Fail if the build touched the upstream checkout
        run: |
          set -euo pipefail
          test -z "$(git -C multica status --porcelain)"

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multica-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify-overlay, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: multica-*
          merge-multiple: true

      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum multica_* multica-cli-* > checksums.txt
          cat checksums.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/multica_*
            dist/multica-cli-*
            dist/checksums.txt
          generate_release_notes: true
