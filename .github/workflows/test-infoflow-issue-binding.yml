name: Test InfoFlow issue binding

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: infoflow_binding_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U test -d infoflow_binding_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:55439/infoflow_binding_test?sslmode=disable
      MULTICA_RUN_REAL_AGENT_SMOKE: "0"
      MULTICA_INFOFLOW_HTTP_TEST: "1"
      MULTICA_INFOFLOW_MIGRATION_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: multica/server/go.mod
          cache-dependency-path: multica/server/go.sum
      - name: Test transport-independent Bridge behavior with fakes
        working-directory: infoflow-bridge
        run: >-
          node --test chat.test.js conversation-context.test.js
          issue-relay.test.js issue-relay-reliability.test.js issue-groups.test.js web-group-bindings.test.js issue-review-regressions.test.js issue-multigroup.test.js issue-private-multi.test.js web-private-bindings.test.js reply-mode.test.js
          reactions.test.js review-notifications.test.js
      - name: Verify standalone restart credentials and private state exclusions
        run: |
          python3 -m unittest discover -s infoflow-bridge/test -p 'test_bridgectl.py' -v
          python3 -m unittest discover -s deploy -p 'test_team_migrate.py' -v
          bash -n deploy/migrate-team.sh deploy/start.sh
      - name: Prepare isolated database and Go overlay
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE infoflow_binding_migrations_test'
          for relay_database in infoflow_binding_test infoflow_binding_migrations_test; do
            relay_database_url="postgres://test:test@127.0.0.1:55439/$relay_database?sslmode=disable"
            (cd multica/server && DATABASE_URL="$relay_database_url" go run ./cmd/migrate up)
            for migration in migrations/001*.up.sql migrations/45*.up.sql migrations/46*.up.sql migrations/47*.up.sql migrations/48*.up.sql migrations/49*.up.sql migrations/50*.up.sql migrations/51*.up.sql; do
              psql "$relay_database_url" -v ON_ERROR_STOP=1 -f "$migration"
            done
          done
          python3 overlays/prepare.py
          python3 overlays/prepare.py --check
      - name: Verify permission, transaction and real HTTP contracts
        working-directory: multica/server
        run: |
          set -euo pipefail
          export GOFLAGS="-overlay=$GITHUB_WORKSPACE/overlays/go-overlay.json -mod=readonly"
          go test -race ./internal/handler -run '^TestInfoFlow' -count=1 -v
          go test -race ./cmd/server -run '^TestInfoFlow' -count=1 -v
          go vet ./internal/handler ./cmd/server
          git -C .. diff --exit-code
  group-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"
      - name: Prepare isolated frontend
        run: |
          set -euo pipefail
          mkdir -p build/group-web
          rsync -a --exclude .git multica/ build/group-web/
          rsync -a overlays/web-direct/ build/group-web/
          MULTICA_WEB_TARGET="$PWD/build/group-web" python3 overlays/web-patch.py apply
          cd build/group-web
          pnpm install --filter '@multica/web...' --frozen-lockfile
      - name: Verify group entry and API boundary
        run: |
          set -euo pipefail
          cd build/group-web
          pnpm --filter @multica/core exec vitest run api/infoflow-groups.test.ts api/infoflow-group-binding.test.ts issues/infoflow-groups.test.ts issues/infoflow-group-binding.test.ts api/infoflow-conversations.test.ts issues/infoflow-conversations.test.ts
          pnpm --filter @multica/views exec vitest run issues/components/issue-infoflow-groups.test.tsx issues/components/issue-infoflow-group-binding.test.tsx issues/components/bind-infoflow-conversation.test.tsx
          pnpm --filter @multica/views exec tsc --noEmit
          git -C "$GITHUB_WORKSPACE/multica" diff --exit-code
