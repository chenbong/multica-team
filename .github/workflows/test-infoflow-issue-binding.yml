name: Test InfoFlow issue binding

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: infoflow_binding_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U test -d infoflow_binding_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:55439/infoflow_binding_test?sslmode=disable
      MULTICA_RUN_REAL_AGENT_SMOKE: "0"
      MULTICA_INFOFLOW_HTTP_TEST: "1"
      MULTICA_INFOFLOW_MIGRATION_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: multica/server/go.mod
          cache-dependency-path: multica/server/go.sum
      - name: Test transport-independent Bridge behavior with fakes
        working-directory: infoflow-bridge
        run: >-
          node --test test/agent-binding.test.js test/company-identity.test.js test/live-activity.test.js chat.test.js conversation-context.test.js inbound-content.test.js reply-images.test.js reply-images-integration.test.js
          issue-relay.test.js issue-relay-reliability.test.js issue-groups.test.js web-group-bindings.test.js issue-review-regressions.test.js issue-multigroup.test.js issue-private-multi.test.js web-private-bindings.test.js reply-mode.test.js
          reactions.test.js task-status-notifications.test.js group-info.test.js conversation-notices.test.js robot-directory.test.js admin-form.test.js private-bind-metadata.test.js issue-handlers.test.js receipt-handoff.test.js reply-mentions.test.js reply-title.test.js group-markdown.test.js reply-format.test.js infoflow-markdown.test.js
      - name: Verify configured Web release acceptance
        run: |
          python3 -m unittest discover -s deploy -p test_verify_web_release.py -v
          node --test deploy/test_apply_brand.cjs
      - name: Verify backup notifications with isolated storage fixtures
        run: |
          python3 -m unittest discover -s deploy -p test_daily_bos_backup.py -v
          python3 -m unittest discover -s deploy -p test_backup_host_runner.py -v
          node --test deploy/test_backup_success_notice.mjs
      - name: Verify standalone restart credentials and private state exclusions
        run: |
          python3 -m unittest discover -s infoflow-bridge/test -p 'test_bridgectl.py' -v
          python3 -m unittest discover -s deploy -p 'test_team_migrate.py' -v
          python3 scripts/builtin-agent-env-sql-test.py
          python3 scripts/resource-web-panels-test.py
          bash -n deploy/migrate-team.sh deploy/start.sh
      - name: Prepare isolated database and Go overlay
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE infoflow_binding_migrations_test'
          for relay_database in infoflow_binding_test infoflow_binding_migrations_test; do
            relay_database_url="postgres://test:test@127.0.0.1:55439/$relay_database?sslmode=disable"
            (cd multica/server && DATABASE_URL="$relay_database_url" go run ./cmd/migrate up)
            DATABASE_URL="$relay_database_url" bash deploy/migrate-team.sh
          done
          python3 overlays/prepare.py
          python3 overlays/prepare.py --check
          python3 scripts/test-skill-global-migration.py
      - name: Verify permission, transaction and real HTTP contracts
        working-directory: multica/server
        run: |
          set -euo pipefail
          export GOFLAGS="-overlay=$GITHUB_WORKSPACE/overlays/go-overlay.json -mod=readonly"
          go test -race ./internal/handler -run '^Test(MachineProvision|MachineScript|IssueCreator|IssueAgentCreator|IssueBatchDeletion|IssueDeletionTransaction|IssueLegacyAdministrators|InfoFlow|SharedChat|BuiltinSandbox|OneAPI|OneToolImport|ImportSkill|ParseSkillArchive|FetchImportedSkill|SkillGovernance|RefreshSkill|SkillRefresh|ResourceWebPanel|IssueTransfer)' -count=1 -v
          go test -race ./internal/handler -run 'Skill' -count=1 -v
          go test -race ./cmd/server -run '^TestInfoFlow' -count=1 -v
          go test -race ./cmd/server -run '^TestPersonalMachineName' -count=1 -v
          go test -race ./internal/handler -run '^Test(MachineName|UpdateAgentRuntime_CustomName|DaemonRegister_.*(CustomName|MachineName))' -count=1 -v
          go test -race ./internal/service -run '^Test(ResourceWebPanelSkill|BuiltinSkillsConformToTemplate|BuiltinSkillsFrontmatterIsStrictYAML|BuiltinSkillPayload)' -count=1 -v
          go test -race ./cmd/multica -run '^TestIssuePanelCLI' -count=1 -v
          go test -race ./internal/handler -run '^Test(ProjectWorkingDirectory|CreateProjectRejectsDuplicateWorkingDirectory|ProjectResourceLocalDirectory|WorktreeClaim)' -count=1 -v
          go test -race ./internal/daemon -run '^Test(ProjectDirectory|FindLocalDirectoryAssignment|AcquireLocalDirectoryLock)' -count=1 -v
          go vet ./internal/handler ./internal/daemon ./cmd/server
          git -C .. diff --exit-code
  group-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"
      - name: Prepare isolated frontend
        run: |
          set -euo pipefail
          mkdir -p build/group-web
          rsync -a --exclude .git multica/ build/group-web/
          rsync -a overlays/web-direct/ build/group-web/
          MULTICA_WEB_TARGET="$PWD/build/group-web" python3 overlays/web-patch.py apply
          cd build/group-web
          pnpm install --filter '@multica/web...' --frozen-lockfile
          npm ci --prefix apps/web/compat --ignore-scripts
      - name: Verify group entry and API boundary
        run: |
          set -euo pipefail
          cd build/group-web
          pnpm --filter @multica/web exec vitest run platform/document-title.test.tsx
          pnpm --filter @multica/core exec vitest run api/infoflow-groups.test.ts api/infoflow-group-binding.test.ts issues/infoflow-groups.test.ts issues/infoflow-group-binding.test.ts api/infoflow-conversations.test.ts issues/infoflow-conversations.test.ts
          pnpm --filter @multica/core exec vitest run api/issue-permissions.test.ts
          pnpm --filter @multica/core exec vitest run api/skill-governance.test.ts
          pnpm --filter @multica/views exec vitest run skills/components/skill-governance.test.tsx skills/lib/skill-creator.test.ts skills/hooks/use-can-edit-skill.test.ts
          pnpm --filter @multica/views exec vitest run issues/actions/__tests__/issue-actions-menu.test.tsx settings/components/personal-secrets-section.test.tsx
          pnpm --filter @multica/web exec vitest run app/live/preview.test.tsx
          pnpm --filter @multica/core exec vitest run runtimes/personal-name-schema.test.ts runtimes/mutations.machine-name.test.tsx
          pnpm --filter @multica/views exec vitest run issues/components/issue-infoflow-groups.test.tsx issues/components/issue-infoflow-group-binding.test.tsx issues/components/bind-infoflow-conversation.test.tsx
          pnpm --filter @multica/views exec vitest run agents/components/inspector/oneapi-thinking.test.ts agents/components/inspector/manual-model-thinking.test.tsx agents/components/inspector/model-change-cleanup.test.ts
          pnpm --filter @multica/core exec vitest run web-panels api/web-panel-schema.test.ts platform/storage-cleanup.test.ts
          pnpm --filter @multica/views exec vitest run web-panels layout/dashboard-layout.test.tsx
          pnpm --filter @multica/views exec vitest run issues/components/issue-jump-to-latest.test.tsx issues/components/issue-detail.test.tsx issues/hooks/use-issue-detail-scroll-restore.test.tsx
          pnpm --filter @multica/views exec vitest run skills/components/create-skill-onetool.test.tsx skills/lib/onetool.test.ts skills/lib/origin.test.ts skills/components/create-skill-dialog.test.tsx skills/components/refresh-skill-dialog.test.tsx skills/components/skills-page.source-link.test.tsx
          pnpm --filter @multica/views exec vitest run projects/components/remote-working-directory.test.tsx projects/components/project-resources-local-directory.test.tsx projects/components/local-directory-hint.test.tsx
          pnpm --filter @multica/views exec vitest run rich-content/latex-delimiters.test.ts rich-content/latex-delimiters.test.tsx rich-content/latex-samples.test.tsx editor/readonly-content-math.test.tsx auth/login-page.test.tsx
          pnpm --filter @multica/core exec tsc --noEmit
          pnpm --filter @multica/views exec tsc --noEmit
          git -C "$GITHUB_WORKSPACE/multica" diff --exit-code
